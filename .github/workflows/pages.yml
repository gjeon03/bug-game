name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one concurrent deployment; a queued run supersedes an older one but never cancels a run
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No explicit version: the action reads `packageManager` from package.json, which is the single
      # source of truth (pnpm@10.13.1). Specifying both can conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # The published bundle must contain no root-absolute reference of any kind, in any file — an
      # absolute url() in the CSS or an absolute fetch() in the JS would 404 under a repository
      # subpath just as surely as one in the HTML, and only the HTML used to be scanned.
      - name: Assert the build is subpath-safe
        run: node scripts/check-subpath.mjs dist

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The E2E suite serves dist/ from a nested /bug-game/ path, so this is also the subpath check.
      # The whole suite, not a subset. An independent verifier found CI was running 3 of 7 specs, so
      # the performance gate, the full-run gate and the threat gate were never enforced on any
      # machine but a developer's.
      - name: Browser tests (nested path)
        run: pnpm test:e2e

      # A failing E2E run reported nothing but "Process completed with exit code 1", and the
      # detail Playwright writes lives in an artifact that needs authentication to download. The
      # job log and $GITHUB_STEP_SUMMARY need auth too — both were tried and neither is readable
      # through the public API. ANNOTATIONS are, so the failure is emitted as `::error::` workflow
      # commands, which surface on the public check-runs annotations endpoint. That makes a failed
      # deployment diagnosable by anyone, with no credentials.
      - name: Explain the E2E failure
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const p = "artifacts/evidence/e2e-results.json";
            const esc = (t) => String(t).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            const ansi = new RegExp(String.fromCharCode(27) + "\\[[0-9;]*m", "g");
            if (!fs.existsSync(p)) {
              console.log("::error::E2E produced no results.json - the suite died before reporting (build or webServer).");
              process.exit(0);
            }
            const r = JSON.parse(fs.readFileSync(p, "utf8"));
            let found = 0;
            const walk = (s) => {
              for (const spec of s.specs ?? []) {
                if (spec.ok) continue;
                found += 1;
                const res = (spec.tests ?? [])[0]?.results?.[0] ?? {};
                const msg = String(res.error?.message ?? "no error message")
                  .replace(ansi, "").slice(0, 900);
                console.log("::error file=" + spec.file + ",line=" + spec.line +
                  "::E2E FAILED [" + spec.title + "] status=" + res.status +
                  " duration=" + Math.round((res.duration ?? 0) / 1000) + "s :: " + esc(msg));
              }
              for (const c of s.suites ?? []) walk(c);
            };
            for (const s of r.suites ?? []) walk(s);
            if (found === 0) console.log("::error::Reporter recorded no failing spec; the runner itself failed.");

            // fullrun 09 writes a decision tally precisely so a CI/local disagreement can be read as
            // "starved of time" vs "stood still". That file lives in the artifact, which needs auth,
            // so the tally is surfaced here too — otherwise the diagnostic the test author built is
            // unreachable exactly when it is needed.
            // Only meaningful when a spec actually failed. `run-progress.json` is committed to the
            // repo, so reporting it when the failure happened BEFORE the browser step (a format or
            // lint failure, say) prints a stale healthy-looking run and points the reader at the
            // wrong thing entirely — which is exactly what it did once.
            // Perf failures need the worst frame's phase breakdown, not just its total. Without it
            // the only recourse is guessing at subsystems, which cost five wrong hypotheses.
            const perf = "artifacts/evidence/perf/perf.json";
            if (found > 0 && fs.existsSync(perf)) {
              const pf = JSON.parse(fs.readFileSync(perf, "utf8"));
              for (const w of pf.windows ?? []) {
                console.log("::error::perf[" + w.label + "] cpuP50=" + w.cpuP50 + " cpuP99=" + w.cpuP99 +
                  " cpuWorst=" + w.cpuWorst + " frames=" + w.frames +
                  " worstFrame=" + esc(JSON.stringify(w.worstFrame ?? pf.worstFrame ?? {})));
              }
            }

            const prog = "artifacts/evidence/run-progress.json";
            if (found > 0 && fs.existsSync(prog)) {
              const g = JSON.parse(fs.readFileSync(prog, "utf8"));
              const st = g.stats ?? {};
              console.log("::error::run-progress: op=" + g.operation + " completed=" + st.operationsCompleted +
                " status=" + g.status + " lose=" + g.loseCause +
                " deliveries=" + st.deliveries + " routines=" + st.routinesExploited +
                " pop=" + (g.colony && g.colony.population) + " food=" + Math.round((g.colony && g.colony.food) || 0) +
                " zonesHeld=" + (Array.isArray(g.zones) ? g.zones.filter((z) => z.held).length : "?") +
                " decisions=" + esc(JSON.stringify(g.decisions ?? {})) +
                " discardedTime=" + ((g.peakPerf && g.peakPerf.discardedTime) ?? "?") +
                " overloadFrames=" + ((g.peakPerf && g.peakPerf.overloadFrames) ?? "?"));
            }
          '

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: artifacts/evidence
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
