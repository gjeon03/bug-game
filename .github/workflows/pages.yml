name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one concurrent deployment; a queued run supersedes an older one but never cancels a run
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No explicit version: the action reads `packageManager` from package.json, which is the single
      # source of truth (pnpm@10.13.1). Specifying both can conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # The published bundle must contain no root-absolute reference of any kind, in any file — an
      # absolute url() in the CSS or an absolute fetch() in the JS would 404 under a repository
      # subpath just as surely as one in the HTML, and only the HTML used to be scanned.
      - name: Assert the build is subpath-safe
        run: node scripts/check-subpath.mjs dist

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The E2E suite serves dist/ from a nested /bug-game/ path, so this is also the subpath check.
      # The whole suite, not a subset. An independent verifier found CI was running 3 of 7 specs, so
      # the performance gate, the full-run gate and the threat gate were never enforced on any
      # machine but a developer's.
      - name: Browser tests (nested path)
        run: pnpm test:e2e

      # A failing E2E run used to report nothing but "Process completed with exit code 1". The
      # detail existed — Playwright's JSON reporter writes it — but only inside an artifact, and
      # downloading an artifact needs authentication. So a deployment could fail and be
      # undiagnosable to anyone without repo credentials, which is exactly what happened on
      # 691b259. The job summary is part of the public check output, so the failure now explains
      # itself on the run page.
      - name: Explain the E2E failure
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const p = "artifacts/evidence/e2e-results.json";
            const out = [];
            if (!fs.existsSync(p)) {
              out.push("No e2e-results.json — the suite died before reporting (build or webServer).");
            } else {
              const r = JSON.parse(fs.readFileSync(p, "utf8"));
              const walk = (s) => {
                for (const spec of s.specs ?? []) {
                  if (spec.ok) continue;
                  out.push("### FAILED: " + spec.title);
                  out.push("`" + spec.file + ":" + spec.line + "`");
                  for (const t of spec.tests ?? [])
                    for (const res of t.results ?? []) {
                      out.push("status: " + res.status + ", duration: " + Math.round((res.duration ?? 0) / 1000) + "s");
                      const m = res.error && res.error.message;
                      if (m) out.push("```\n" + m.replace(new RegExp(String.fromCharCode(27) + "\\[[0-9;]*m", "g"), "").slice(0, 2500) + "\n```");
                    }
                }
                for (const c of s.suites ?? []) walk(c);
              };
              for (const s of r.suites ?? []) walk(s);
              if (out.length === 0) out.push("Reporter recorded no failing spec; the runner itself failed.");
            }
            const body = "## E2E failure detail\n\n" + out.join("\n\n") + "\n";
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body);
            console.log(body);
          '

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: artifacts/evidence
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
