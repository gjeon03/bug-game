<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!--
      Both of these are filled from the catalog at boot — see `src/game/boot.ts`.

      They used to carry hardcoded Korean written for the five-room scope: "…집 전체까지…" and
      "집 전체를 점거하라". The kitchen has been the whole game since the reseal, `src/i18n/ko.ts`
      has said so correctly for just as long, and nothing was reading it: `boot.ts` overwrote the
      title at runtime but never the description, so the tab was briefly wrong on every load and
      the description was wrong permanently. §4 puts player-facing strings in the catalog, and a
      `<meta>` tag is player-facing the moment the page is shared or indexed.

      Left empty rather than pre-filled, so a wiring failure shows as a blank tab and not as a
      confident lie.
    -->
    <meta name="description" content="" />
    <title></title>
    <!--
      An inline data-URI favicon, not a file. Without it the browser requests /favicon.ico, gets a
      404, and trips the "zero missing asset requests" gate for a resource the page never asked for.
      A data URI also cannot become a root-absolute path, so it is safe under the nested-subpath
      contract.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070a10'/%3E%3Cg stroke='%23c07a34' stroke-width='1.5' stroke-linecap='round'%3E%3Cpath d='M13 9 L7 4M19 9 L25 4'/%3E%3Cpath d='M11 14 L4 11M11 18 L4 19M12 22 L6 27M21 14 L28 11M21 18 L28 19M20 22 L26 27'/%3E%3C/g%3E%3Cellipse cx='16' cy='19' rx='6.2' ry='8.8' fill='%236b3f18'/%3E%3Cellipse cx='16' cy='13' rx='5.2' ry='4.4' fill='%23c07a34'/%3E%3Cellipse cx='16' cy='8.6' rx='2.5' ry='2.1' fill='%233a220c'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="게임 화면" role="img"></canvas>
      <div id="hud" aria-live="polite"></div>
    </div>
    <noscript>
      <div id="noscript">이 게임은 자바스크립트가 켜져 있어야 실행된다.</div>
    </noscript>
    <script type="module" src="/src/game/boot.ts"></script>
  </body>
</html>
