<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>걸레받이 제국 — 화질 증명 장면</title>
    <meta name="description" content="three.js 리부트의 최종 화질 증명 장면. 게임 본편이 아니다." />
    <!--
      An inline data-URI favicon, not a file.

      Without it the browser requests /favicon.ico and gets a 404, which trips the "zero missing
      asset requests" gate for a resource the page never asked for. A data URI also cannot become a
      root-absolute path, so it is safe under the nested-subpath contract.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305070b'/%3E%3Cellipse cx='8' cy='8' rx='3' ry='5' fill='%238a5524'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      The proof scene is a separate entry point on purpose.

      The brief requires one final-quality scene to exist and be judged BEFORE the whole map is
      built, and the Canvas2D game must keep running until the three.js path has actually earned
      the replacement. Two entry points, one production renderer — the old one is deleted when this
      scene passes, not kept as a second path.
    -->
    <canvas id="proof"></canvas>

    <div id="overlay">
      <div id="objective"></div>
      <div id="readout"></div>
    </div>

    <noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
    <script type="module" src="/src/proof/main.ts"></script>
  </body>
</html>
